version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  groups:
    actions-updates:
      dependency-type: production
      applies-to: version-updates
    actions-dev-updates:
      dependency-type: development
      applies-to: version-updates
- package-ecosystem: cargo
  directory: /
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  groups:
    cargo-updates:
      dependency-type: production
      applies-to: version-updates
    cargo-dev-updates:
      dependency-type: development
      applies-to: version-updates
- package-ecosystem: cargo
  directory: /hack/ci
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
- package-ecosystem: swift
  # The app's SwiftPM dependencies live in the Xcode project (no Package.swift):
  # apple/uemulator.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved.
  directory: /apple
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  groups:
    swift-updates:
      patterns:
      - "*"
      applies-to: version-updates
