name: pages

# Builds the web UI (hack/web.sh) and publishes it to GitHub Pages under /web/, leaving the site's
# root free for a real site later. Nothing the build produces is committed: the site exists only
# as the Pages artifact of the last run on main.
on:
  push:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: read # Needed to checkout the repository.

concurrency:
  group: "${{ github.workflow }}"
  # A deployment half done when the next push arrives is finished, not cancelled.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
    - name: harden runner
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        egress-policy: audit

    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install targets
      # The page's module, and the UEFI firmware it boots through.
      run: rustup target add wasm32-unknown-unknown x86_64-unknown-none

    - name: build the web UI
      # With the demo machines (hack/web/demo.py), so the published page opens on buttons that
      # boot Alpine and Edera's Xen with Alpine as dom0. Xen comes from ghcr.io, pinned by the
      # manifest digest in hack/web/demo-xen.ref and checked against it.
      env:
        WEB_DEMO: 1
      run: ./hack/web.sh

    - name: lay out the site
      # The runner has no cached kernels, so target/web has no assets/ to leave out.
      run: |
        mkdir -p _site
        cp -R target/web _site/web

    - name: upload the site
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: _site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # Needed to publish the site.
      id-token: write # Needed to prove the deployment came from this workflow.
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}web/"
    steps:
    - name: harden runner
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        egress-policy: audit

    - name: deploy
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
