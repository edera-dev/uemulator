name: check

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main

permissions:
  contents: read # Needed to checkout the repository.

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  # Only cancel superseded pull request runs, so every push to main is fully checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
    - name: harden runner
      uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
      with:
        egress-policy: audit

    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install firmware target
      run: rustup target add x86_64-unknown-none

    - name: cargo build
      run: cargo build --release --workspace

  test:
    # The two runs share nothing but the checkout, so they go side by side: in series they were
    # about 10 minutes each, almost all of it a handful of long machine and JIT tests.
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: workspace
          id: workspace
          args: --workspace
        - name: no default features
          id: no-default-features
          args: -p uemulator --no-default-features
    steps:
    - name: harden runner
      uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
      with:
        egress-policy: audit

    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install firmware target
      run: rustup target add x86_64-unknown-none

    - name: cache cargo
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: test-${{ matrix.id }}
        # Pull requests read main's cache; only main writes it, so they cannot evict it.
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: cache nextest
      id: nextest-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/bin/cargo-nextest
        key: nextest-${{ runner.os }}-${{ hashFiles('hack/ci/Cargo.lock') }}

    - name: install nextest
      if: steps.nextest-cache.outputs.cache-hit != 'true'
      # The version comes from hack/ci/Cargo.lock, which Dependabot keeps current.
      # --force: rust-cache restores ~/.cargo/bin without cargo's install records,
      # so after a version bump misses the nextest cache the old binary is still
      # there and an unforced install refuses to replace it.
      run: |
        version=$(awk '/^name = "cargo-nextest"$/ { getline; gsub(/[^0-9.]/, "", $3); print $3 }' hack/ci/Cargo.lock)
        test -n "${version}"
        cargo install --locked --force cargo-nextest --version "${version}"

    - name: cargo nextest
      run: cargo nextest run --release ${{ matrix.args }}

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
    - name: harden runner
      uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
      with:
        egress-policy: audit

    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install clippy
      run: rustup component add clippy

    - name: install firmware target
      run: rustup target add x86_64-unknown-none

    - name: cargo clippy
      run: cargo clippy --release --workspace --all-targets -- -D warnings

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
    - name: harden runner
      uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
      with:
        egress-policy: audit

    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install rustfmt
      run: rustup component add rustfmt

    - name: cargo fmt
      run: cargo fmt --all -- --check
