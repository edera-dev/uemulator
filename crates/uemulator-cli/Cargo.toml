[package]
name = "uemulator-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "uemulator"
path = "src/main.rs"

[features]
default = ["jit"]
jit = ["uemulator/jit"]

[dependencies]
uemulator = { path = "../uemulator", default-features = false }
uemulator-bootstrap = { path = "../uemulator-bootstrap" }
clap = { version = "4", features = ["derive"] }
ureq = "3"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
flate2 = "1"
getrandom = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
