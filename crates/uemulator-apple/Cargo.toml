[package]
name = "uemulator-apple"
description = "uemulator as a static library with a C ABI, for the SwiftUI app on macOS and iOS (docs/plans/28-apple.md)"
version.workspace = true
edition.workspace = true

# A staticlib on Apple targets, linked into the app by apple/uemulator.xcodeproj through
# hack/apple/build-core.sh. On other hosts it is an empty rlib, so `cargo test --workspace` and
# clippy on Linux build it without producing an archive nobody links.
[lib]
crate-type = ["staticlib", "rlib"]

[target.'cfg(target_vendor = "apple")'.dependencies]
uemulator = { path = "../uemulator" }
# machine.toml, the CLI's machine format, kept as an untyped table so keys the app does not know
# survive it; JSON is how it crosses to Swift.
toml = "1.1.8"
serde_json = "1"
